apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: widgets}
            - {name: POSTGRES_PASSWORD, value: widgets}
            - {name: POSTGRES_DB, value: widgets}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "widgets", "-d", "widgets"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: platform-postgres
spec:
  selector:
    app.kubernetes.io/name: platform-postgres
  ports:
    - port: 5432
      targetPort: 5432
